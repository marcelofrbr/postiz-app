# Stack Docker Swarm (Portainer) para o Postiz, com Traefik na rede externa marcelonet.
# Variáveis obrigatórias (definir no Portainer em "Environment variables"):
#   POSTIZ_DOMAIN   ex: postiz.seudominio.com
#   JWT_SECRET      string aleatória longa
#   POSTGRES_PASSWORD
# Pré-requisito: rede overlay externa "marcelonet" e Traefik com certresolver "letsencryptresolver"
# (ajuste o nome do resolver e do entrypoint abaixo se o seu Traefik usar outros).

version: "3.8"

services:
  postiz:
    image: ghcr.io/gitroomhq/postiz-app:latest
    environment:
      MAIN_URL: "https://${POSTIZ_DOMAIN}"
      FRONTEND_URL: "https://${POSTIZ_DOMAIN}"
      NEXT_PUBLIC_BACKEND_URL: "https://${POSTIZ_DOMAIN}/api"
      JWT_SECRET: "${JWT_SECRET}"
      DATABASE_URL: "postgresql://postiz-user:${POSTGRES_PASSWORD}@postiz-postgres:5432/postiz-db"
      REDIS_URL: "redis://postiz-redis:6379"
      BACKEND_INTERNAL_URL: "http://localhost:3000"
      TEMPORAL_ADDRESS: "temporal:7233"
      IS_GENERAL: "true"
      DISABLE_REGISTRATION: "false"
      STORAGE_PROVIDER: "local"
      UPLOAD_DIRECTORY: "/uploads"
      NEXT_PUBLIC_UPLOAD_DIRECTORY: "/uploads"
      NX_ADD_PLUGINS: "false"
      API_LIMIT: "30"
    volumes:
      - postiz-config:/config/
      - postiz-uploads:/uploads/
    networks:
      - marcelonet
      - postiz-internal
    deploy:
      replicas: 1
      labels:
        - traefik.enable=true
        - traefik.docker.network=marcelonet
        - traefik.http.routers.postiz.rule=Host(`${POSTIZ_DOMAIN}`)
        - traefik.http.routers.postiz.entrypoints=websecure
        - traefik.http.routers.postiz.tls=true
        - traefik.http.routers.postiz.tls.certresolver=letsencryptresolver
        - traefik.http.services.postiz.loadbalancer.server.port=5000

  postiz-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postiz-user
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: postiz-db
    volumes:
      - postiz-postgres:/var/lib/postgresql/data
    networks:
      - postiz-internal
    deploy:
      replicas: 1

  postiz-redis:
    image: redis:7.2
    volumes:
      - postiz-redis:/data
    networks:
      - postiz-internal
    deploy:
      replicas: 1

  # Temporal (workflows de agendamento)
  temporal-postgresql:
    image: postgres:16
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - temporal-postgres:/var/lib/postgresql/data
    networks:
      - postiz-internal
    deploy:
      replicas: 1

  temporal-elasticsearch:
    image: elasticsearch:7.17.27
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: "-Xms256m -Xmx256m"
      xpack.security.enabled: "false"
      cluster.routing.allocation.disk.threshold_enabled: "true"
      cluster.routing.allocation.disk.watermark.low: 512mb
      cluster.routing.allocation.disk.watermark.high: 256mb
      cluster.routing.allocation.disk.watermark.flood_stage: 128mb
    volumes:
      - temporal-es:/usr/share/elasticsearch/data
    networks:
      - postiz-internal
    deploy:
      replicas: 1

  temporal:
    image: temporalio/auto-setup:1.28.1
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: "${POSTGRES_PASSWORD}"
      POSTGRES_SEEDS: temporal-postgresql
      ENABLE_ES: "true"
      ES_SEEDS: temporal-elasticsearch
      ES_VERSION: v7
      TEMPORAL_NAMESPACE: default
    networks:
      - postiz-internal
    deploy:
      replicas: 1

volumes:
  postiz-config:
  postiz-uploads:
  postiz-postgres:
  postiz-redis:
  temporal-postgres:
  temporal-es:

networks:
  marcelonet:
    external: true
  postiz-internal:
    driver: overlay
